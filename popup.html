<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书自动评论</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>小红书自动评论</h1>
      <span id="statusBadge" class="badge badge-idle">空闲</span>
    </header>

    <main class="form">
      <div class="field">
        <label for="keyword">搜索关键词</label>
        <input id="keyword" type="text" placeholder="例如：护肤" autocomplete="off">
      </div>

      <div class="field">
        <label for="comments">评论内容<span class="hint">（每行一条，随机选取）</span></label>
        <textarea id="comments" rows="5" placeholder="第一行评论&#10;第二行评论&#10;第三行评论"></textarea>
      </div>

      <div class="field row">
        <div class="col">
          <label for="targetCount">发帖数量</label>
          <input id="targetCount" type="number" min="1" max="30" step="1" value="5">
        </div>
        <div class="col">
          <label for="minDelay">最小延迟（秒）</label>
          <input id="minDelay" type="number" min="0" step="1" value="0">
        </div>
        <div class="col">
          <label for="maxDelay">最大延迟（秒）</label>
          <input id="maxDelay" type="number" min="0" step="1" value="10">
        </div>
      </div>

      <div class="dedup">
        <div class="hint" id="sentTodayText">今日已发送：0 篇（自动去重中）</div>
        <button id="clearSentBtn" class="btn btn-danger" type="button" style="flex:0 0 auto;padding:4px 10px;font-size:12px;">清空今日记录</button>
      </div>

      <div class="actions">
        <button id="startBtn" class="btn btn-primary" type="button">开始自动任务</button>
        <button id="stopBtn" class="btn btn-danger" type="button" disabled>停止</button>
      </div>

      <div class="progress">
        <div class="progress-text" id="progressText">进度：0 / 0</div>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="field">
        <label>运行日志</label>
        <div id="logArea" class="log-area" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
